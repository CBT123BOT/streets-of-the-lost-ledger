<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Phone setup: no pinch-zoom, use the whole screen (even around the notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crypto Bros">
  <meta name="theme-color" content="#1a1030">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon_192.png">
  <link rel="apple-touch-icon" href="assets/icon_192.png">
  <title>CRYPTO BROS: Streets of the Lost Ledger</title>
  <style>
    html, body { margin: 0; background: #000; width: 100%; height: 100%; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* The game fills the screen but stays out of the notch / home-bar areas */
    #game { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left); right: env(safe-area-inset-right); outline: none; }
    /* ---- Touch controls: hidden on desktop, shown on phones ---- */
    #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    body.touch #touch { display: block; }
    #dpad { pointer-events: auto; position: absolute; width: 36vh; height: 36vh; max-width: 180px; max-height: 180px; min-width: 120px; min-height: 120px;
      left: calc(env(safe-area-inset-left) + 1vh); bottom: calc(env(safe-area-inset-bottom) + 1vh);
      border-radius: 50%; background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.28); touch-action: none; }
    #dpad::before { content: ''; position: absolute; inset: 33% 8%; background: rgba(255,255,255,0.10); border-radius: 8px; }
    #dpad::after  { content: ''; position: absolute; inset: 8% 33%; background: rgba(255,255,255,0.10); border-radius: 8px; }
    #knob { position: absolute; left: 35%; top: 35%; width: 30%; height: 30%; border-radius: 50%; background: rgba(255,255,255,0.30); z-index: 1; }
    .btn { pointer-events: auto; position: absolute; border-radius: 50%; touch-action: none;
      display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.85); font: bold 20px monospace;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); width: 17vh; height: 17vh; min-width: 58px; min-height: 58px; max-width: 84px; max-height: 84px; }
    .btn.on { background: rgba(255,210,77,0.45); }
    .btn.p { right: calc(env(safe-area-inset-right) + 21vh); bottom: calc(env(safe-area-inset-bottom) + 3vh); background: rgba(229,57,53,0.25); }
    .btn.k { right: calc(env(safe-area-inset-right) + 2vh);  bottom: calc(env(safe-area-inset-bottom) + 10vh); background: rgba(42,168,255,0.25); }
    .btn.j { right: calc(env(safe-area-inset-right) + 13vh); bottom: calc(env(safe-area-inset-bottom) + 25vh); background: rgba(46,204,113,0.25); }
    .small { pointer-events: auto; position: absolute; top: calc(env(safe-area-inset-top) + 1vh); padding: 6px 10px; border-radius: 10px; touch-action: none;
      color: #fff; font: bold 12px monospace; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.35); }
    .small.on { background: rgba(255,210,77,0.45); }
    #startBtn { right: calc(env(safe-area-inset-right) + 1vh); }
    #pauseBtn { right: calc(env(safe-area-inset-right) + 1vh + 74px); }
    #fsBtn { pointer-events: auto; position: fixed; z-index: 11; top: calc(env(safe-area-inset-top) + 1vh); left: calc(env(safe-area-inset-left) + 1vh);
      padding: 4px 8px; border-radius: 8px; font: bold 14px monospace; color: #fff; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.35); }
    body:not(.touch) #fsBtn { top: auto; bottom: 8px; left: 8px; }
    /* Portrait on a phone: ask to rotate */
    #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #120a22; color: #ffd34d;
      font: bold 20px monospace; text-align: center; flex-direction: column; align-items: center; justify-content: center; }
    #rotate .phone { width: 60px; height: 100px; border: 4px solid #ffd34d; border-radius: 10px; margin-bottom: 20px; animation: turn 1.6s ease-in-out infinite; }
    @keyframes turn { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) { body.touch #rotate { display: flex; } }
  </style>
  <!-- Phaser game engine from a CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <!-- Touch controls (phones only) -->
  <div id="touch">
    <div id="dpad"><div id="knob"></div></div>
    <div class="btn p" data-b="punch">P</div>
    <div class="btn k" data-b="kick">K</div>
    <div class="btn j" data-b="jump">J</div>
    <div class="small" id="startBtn" data-b="start">START</div>
    <div class="small" id="pauseBtn" data-b="pause">II PAUSE</div>
  </div>
  <button id="fsBtn" title="Fullscreen">⛶</button>
  <div id="rotate"><div class="phone"></div>Turn your phone sideways<br><span style="font-size:13px;color:#ccc">to play CRYPTO BROS</span></div>
  <!-- Our game files (order matters: settings first, main last) -->
  <script src="config.js?v=10"></script>
  <script src="audio.js?v=10"></script>
  <script src="controls.js?v=10"></script>
  <script src="sprites.js?v=10"></script>
  <script src="fighters.js?v=10"></script>
  <script src="stage.js?v=10"></script>
  <script src="brawl.js?v=10"></script>
  <script src="bonus.js?v=10"></script>
  <script src="scenes.js?v=10"></script>
  <script src="main.js?v=10"></script>
</body>
</html>
